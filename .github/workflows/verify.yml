name: Verify Eva

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Codex used by the offline integration tests
        run: npm install --global --no-audit --no-fund @openai/codex@0.167.1
      - name: Install readers for the portrait artwork checks
        run: python3 -m pip install -r tools/requirements-art-check.txt
      - run: python3 tools/audit_source.py
      - run: bash tools/check.sh

  webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install the verified Chrome for Testing browser
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: 157.0.8103.78
      - name: Exercise Home and chat in Chromium with WebGL
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/verify_ui.mjs app/build/ui-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eva-ui
          path: app/build/ui-check/*.png
          retention-days: 7
          if-no-files-found: ignore
