<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'"><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="composer.css"><title>Дом Евы</title></head><body>
<main id="screen"><div id="world"><canvas id="scene" aria-label="Комната Евы. Коснись пола, чтобы Ева подошла"></canvas></div><div class="shade"></div>
<header><div class="now"><time id="clock">--:--</time><div id="calendar"></div><button id="weather" class="weather-chip" aria-label="Погода за окном">Погода</button></div><div class="top-status"><span id="battery" role="img" hidden><i class="battery-icon" aria-hidden="true"></i><span id="battery-level" aria-hidden="true"></span></span><button id="wallet" aria-label="Недельный лимит Codex" aria-haspopup="dialog"><i class="art-icon coin-art" aria-hidden="true"></i><span id="balance">—</span></button><button id="device-monitor" class="pill" aria-haspopup="dialog"><i data-eva-icon="monitor" aria-hidden="true"></i>Диспетчер</button></div></header>
<aside id="stream-chat" aria-labelledby="stream-chat-title" hidden>
  <div class="stream-heading"><h2 id="stream-chat-title">Чат стрима</h2><button id="expand-stream" aria-label="Развернуть трансляцию" aria-haspopup="dialog"><i data-eva-icon="expand" aria-hidden="true"></i></button></div>
  <p class="stream-chat-empty">Зрители подключаются…</p>
  <ol role="log" aria-labelledby="stream-chat-title" tabindex="0"></ol>
</aside>
<div id="speech"></div><div id="world-status" role="status" hidden></div>
<button id="town-mark" hidden></button><div id="town-answer" hidden></div><section id="town-options" hidden></section>
<form id="town-compose" class="eva-composer" hidden aria-label="Чат с Евой"><button type="button" data-mic aria-label="Голосовой набор" aria-pressed="false"><i data-eva-icon="mic" aria-hidden="true"></i></button><input aria-label="Сообщение Еве" maxlength="8000" placeholder="Сообщение Еве…" enterkeyhint="send"><button type="submit" aria-label="Отправить"><i data-eva-icon="send" aria-hidden="true"></i></button><button type="button" data-expand aria-label="Развернуть чат"><i data-eva-icon="expand" aria-hidden="true"></i></button></form>
<section id="layout-tools" aria-label="Расстановка" hidden><div><strong id="layout-name"></strong><span id="layout-hint" role="status"></span></div><div class="layout-buttons"><button id="layout-palette"><i data-eva-icon="add" aria-hidden="true"></i>Предмет</button><button id="layout-delete" hidden><i data-eva-icon="bin" aria-hidden="true"></i>Убрать</button><button id="layout-rotate" hidden><i data-eva-icon="rotateRight" aria-hidden="true"></i><span id="layout-angle">Повернуть</span></button><button id="layout-undo" hidden><i data-eva-icon="rotateLeft" aria-hidden="true"></i>Шаг назад</button><button id="layout-pan" aria-pressed="false" hidden>Обзор</button><button id="layout-cancel">Закрыть</button><button id="layout-apply" hidden><i data-eva-icon="check" aria-hidden="true"></i>Поставить</button></div></section>
<nav id="folders" aria-label="Значки рабочего стола"></nav><div id="actions"><button id="fallback-chat" class="pill" hidden><i data-eva-icon="chat" aria-hidden="true"></i>Чат с Евой</button><button id="home-menu" class="pill" aria-haspopup="dialog"><i data-eva-icon="compass" aria-hidden="true"></i>Меню</button></div>
<nav id="dock" aria-label="Приложения"><div id="favorites"></div><button id="all" aria-label="Все приложения"><i data-eva-icon="grid" aria-hidden="true"></i></button></nav></main>
<div id="scrim" hidden></div><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="title" hidden><div class="grip"></div><div class="sheethead"><h1 id="title"></h1><div class="sheet-buttons"><button id="sheet-options" type="button" aria-label="Действия с папкой" hidden><i data-eva-icon="more" aria-hidden="true"></i></button><button id="close" aria-label="Закрыть"><i data-eva-icon="close" aria-hidden="true"></i></button></div></div><div id="content"></div></section><script src="ui-icons.js"></script><script src="folders.js"></script><script src="launcher.js"></script><script src="monitor.js"></script><script src="question-options.js"></script><script type="module" src="game.mjs"></script></body></html>
