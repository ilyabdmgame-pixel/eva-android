<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'"><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="composer.css"><title>Дом Евы</title></head><body>
<main id="screen"><div id="world"><canvas id="scene" aria-label="Комната Евы. Коснись пола, чтобы Ева подошла"></canvas></div><div class="shade"></div>
<header><div class="now"><time id="clock">--:--</time><div id="calendar"></div><button id="weather" class="weather-chip" aria-label="Погода за окном">Погода</button></div><div class="top-tools"><button id="places" class="pill" aria-label="Настройки комнаты"><i class="art-icon map-art" aria-hidden="true"></i><span id="place">Комната</span><b>⌄</b></button><button id="wallet" aria-label="Открыть инвентарь"><i class="art-icon coin-art" aria-hidden="true"></i><span id="balance">0</span></button></div></header>
<div id="speech"></div><div id="world-status" role="status" hidden></div>
<button id="town-mark" hidden></button><div id="town-answer" hidden></div><section id="town-options" hidden></section>
<form id="town-compose" class="eva-composer" hidden aria-label="Чат с Евой"><button type="button" data-mic aria-label="Голосовой набор" aria-pressed="false"><i class="eva-composer-icon" aria-hidden="true"></i></button><input aria-label="Сообщение Еве" maxlength="8000" placeholder="Сообщение Еве…" enterkeyhint="send"><button type="submit" aria-label="Отправить"><i class="eva-composer-icon eva-composer-send" aria-hidden="true"></i></button><button type="button" data-expand aria-label="Развернуть чат"><i class="eva-composer-icon eva-composer-expand" aria-hidden="true"></i></button></form>
<section id="layout-tools" aria-label="Расстановка" hidden><div><strong id="layout-name"></strong><span id="layout-hint" role="status"></span></div><div class="layout-buttons"><button id="layout-palette">＋ Предмет</button><button id="layout-delete" hidden>Убрать</button><button id="layout-rotate" hidden>Повернуть</button><button id="layout-undo" hidden>Шаг назад</button><button id="layout-pan" aria-pressed="false" hidden>Обзор</button><button id="layout-cancel">Закрыть</button><button id="layout-apply" hidden>Поставить</button></div></section>
<nav id="folders" aria-label="Значки рабочего стола"></nav><div id="actions"><button id="toys" class="pill"><i class="art-icon journal-art" aria-hidden="true"></i>События</button><button id="interact" class="pill"><i class="art-icon compass-art" aria-hidden="true"></i>В комнате</button></div>
<nav id="dock" aria-label="Приложения"><div id="favorites"></div><button id="all" aria-label="Все приложения"><i class="art-icon grid-art" aria-hidden="true"></i></button></nav></main>
<div id="scrim" hidden></div><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="title" hidden><div class="grip"></div><div class="sheethead"><h1 id="title"></h1><div class="sheet-buttons"><button id="sheet-options" type="button" aria-label="Действия с папкой" hidden></button><button id="close" aria-label="Закрыть">×</button></div></div><div id="content"></div></section><script src="folders.js"></script><script src="launcher.js"></script><script src="question-options.js"></script><script type="module" src="game.mjs"></script></body></html>
